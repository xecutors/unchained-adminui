
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "mikearaya"
    commit-message:
      # Prefix all commit messages with "npm: "
      prefix: "[npm] "
    labels:
      - "npm"
      - "dependencies"
    reviewers:
      - "mikearaya"
    target-branch: "develop"
      
